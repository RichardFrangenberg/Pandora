name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  legacy:
    # 3.7 is the Python version of the Pandora v1.1 installer. These versions are
    # not available on the hosted runners anymore, so they are tested in containers.
    name: ubuntu / Python ${{ matrix.python }} (container)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.7", "3.9"]
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          useradd -m tester
          chown -R tester .
          su tester -c "python -m pytest tests -q -p no:cacheprovider"
