name: Docker

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and run the coordinator container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the coordinator
        run: |
          mkdir -p "$RUNNER_TEMP/pandora"
          cat > .env <<EOF
          PANDORA_ROOT_HOST=$RUNNER_TEMP/pandora
          PUID=$(id -u)
          PGID=$(id -g)
          EOF
          docker compose up -d --build
      - name: Wait until the coordinator is healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' pandora-coordinator)
            echo "$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker logs pandora-coordinator
          exit 1
      - name: The coordinator writes to the root folder as the configured user
        run: |
          test -f "$RUNNER_TEMP/pandora/Scripts/PandoraCoordinator/Coordinator_Settings.json"
          test "$(stat -c %u "$RUNNER_TEMP/pandora/Scripts/PandoraCoordinator/heartbeat")" = "$(id -u)"
      - name: The coordinator stops cleanly
        run: |
          docker compose stop
          test "$(docker inspect -f '{{.State.ExitCode}}' pandora-coordinator)" = "0"
          docker logs pandora-coordinator | grep "Coordinator closed"

  publish:
    name: Publish the image
    needs: test
    # Publishing is disabled in the original repository until a registry is set up there.
    if: >-
      github.event_name == 'push'
      && github.repository_owner != 'RichardFrangenberg'
      && (github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pandora-coordinator
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/development' }}
            type=ref,event=branch
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
